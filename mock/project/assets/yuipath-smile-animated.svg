<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" fill="none">
                <style>
                    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
                    @keyframes sway { 0%, 100% { transform: translateX(0); } 40%, 60% { transform: translateX(12px); } 100% { transform: translateX(0); } }
                    .eye { transform-box: fill-box; transform-origin: center; animation: blink 3s infinite; }
                    .b1 { animation: sway 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                    .b2 { animation: sway 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.05s; }
                    .b3 { animation: sway 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.1s; }
                </style>
                <rect x="20" y="100" width="100" height="35" rx="12" fill="#1E40AF" class="b3" />
                <rect x="40" y="60" width="100" height="35" rx="12" fill="#3B82F6" class="b2" />
                <g class="b1">
                    <rect x="20" y="20" width="120" height="35" rx="12" fill="#93C5FD" />
                    <circle cx="55" cy="37.5" r="3.5" fill="#1E293B" class="eye" />
                    <circle cx="85" cy="37.5" r="3.5" fill="#1E293B" class="eye" />
                    <path d="M62 43C62 43 65 47 70 47C75 47 78 43 78 43" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />
                </g></svg>