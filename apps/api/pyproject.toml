[project]
name = "yuipath-api"
version = "0.0.0"
description = "YuiPath FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "boto3>=1.35.0",
  "mangum>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "boto3-stubs[dynamodb]>=1.35.0",
  "moto[dynamodb]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuipath_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
