services:
  api:
    build:
      context: ./apps/api
    environment:
      YUIPATH_AUTH_MODE: dev
      YUIPATH_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      YUIPATH_AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src:ro
    depends_on:
      dynamodb-local:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/index.html:/app/index.html:ro
    depends_on:
      - api

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports:
      - "8001:8000"
    volumes:
      - dynamodb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ -o /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dynamodb-init:
    image: amazon/aws-cli:2.17.51
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      aws dynamodb describe-table --table-name yuipath-dev --endpoint-url http://dynamodb-local:8000 2>/dev/null \
        || aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 \
            --table-name yuipath-dev \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S \
              AttributeName=SK,AttributeType=S \
              AttributeName=GSI1PK,AttributeType=S \
              AttributeName=GSI1SK,AttributeType=S \
              AttributeName=GSI3PK,AttributeType=S \
              AttributeName=GSI3SK,AttributeType=S \
            --key-schema \
              AttributeName=PK,KeyType=HASH \
              AttributeName=SK,KeyType=RANGE \
            --global-secondary-indexes \
              'IndexName=GSI1,KeySchema=[{AttributeName=GSI1PK,KeyType=HASH},{AttributeName=GSI1SK,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
              'IndexName=GSI3,KeySchema=[{AttributeName=GSI3PK,KeyType=HASH},{AttributeName=GSI3SK,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
            --billing-mode PAY_PER_REQUEST
      echo 'DynamoDB Local initialized'
      "

volumes:
  dynamodb-data:
