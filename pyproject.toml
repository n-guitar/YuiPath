[project]
name = "yuipath-workspace"
version = "0.0.0"
description = "YuiPath Python workspace root"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "N",                # pep8-naming
  "SIM",              # simplify
  "RUF",              # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # FastAPI Depends/Path/Query in defaults is the idiomatic style
  "N818",  # don't require Error suffix on exception names
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
